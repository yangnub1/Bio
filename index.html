<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chị Nào...</title>
  <style>
    /* 1. Nền hồng đen sang xịn mịn & Căn giữa màn hình */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Nền chuyển màu từ đen sang hồng đậm kiểu Aesthetic */
      background: radial-gradient(circle, #2b0813 0%, #0d0205 70%, #000000 100%);
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
    }

    /* 2. Khung chứa ảnh & Hiệu ứng Blur nền phía sau */
    .card-container {
      position: relative;
      z-index: 10;
      padding: 20px;
      /* Hiệu ứng kính mờ (Glassmorphism / Blur) */
      background: rgba(255, 182, 193, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 105, 180, 0.3);
      box-shadow: 0 8px 32px 0 rgba(255, 20, 147, 0.25);
      text-align: center;
    }

    /* 3. Đặt style & Border xịn cho ảnh + Animation nhịp đập nhẹ */
    .card-container img {
      width: 300px;
      height: 380px;
      object-fit: cover;
      border-radius: 16px;
      /* Viền gradient hồng néon lung linh */
      border: 4px solid transparent;
      background: linear-gradient(to bottom right, #ff758c, #ff7eb3) border-box;
      box-shadow: 0 0 25px rgba(255, 117, 140, 0.6);
      /* Hiệu ứng phấp phới/đập nhẹ */
      animation: pulse 3s infinite ease-in-out;
    }

    /* Caption chữ phía dưới ảnh */
    .caption {
      margin-top: 15px;
      color: #ffb6c1;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
    }

    /* Animation nhịp đập cho ảnh */
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(255, 117, 140, 0.6);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 40px rgba(255, 105, 180, 0.9);
      }
    }

    /* 4. Style cho Tim, Hoa, Lá, Cành rơi */
    .falling-item {
      position: absolute;
      top: -50px;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
    }

    /* Animation rơi xoay vòng sống động */
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Khung ảnh chính -->
  <div class="card-container">
    <img src="chita.jpg" alt="Chị nào...">
    <div class="caption">Chị nào... ✨💖</div>
  </div>

  <!-- JavaScript tự động tạo hiệu ứng hoa lá tim rơi liên tục -->
  <script>
    // Danh sách icon Trái tim, Hoa, Cành, Lá hòe
    const icons = ['💖', '❤️', '🌸', '🌺', '🌹', '🍃', '🌿', '✨', '💐', '🌷'];

    function createFallingItem() {
      const item = document.createElement('div');
      item.classList.add('falling-item');
      
      // Chọn ngẫu nhiên 1 icon
      item.innerText = icons[Math.floor(Math.random() * icons.length)];
      
      // Đặt vị trí xuất hiện ngẫu nhiên theo chiều ngang
      item.style.left = Math.random() * 100 + 'vw';
      
      // Kích thước ngẫu nhiên
      item.style.fontSize = (Math.random() * 20 + 15) + 'px';
      
      // Thời gian rơi ngẫu nhiên (từ 4s - 9s)
      const duration = Math.random() * 5 + 4;
      item.style.animationDuration = duration + 's';
      
      // Độ mờ ngẫu nhiên
      item.style.opacity = Math.random() * 0.7 + 0.3;

      document.body.appendChild(item);

      // Tự xóa phần tử sau khi rơi xong để nhẹ trình duyệt
      setTimeout(() => {
        item.remove();
      }, duration * 1000);
    }

    // Tần suất tạo item mới (mỗi 300ms tạo 1 cái)
    setInterval(createFallingItem, 300);
  </script>

</body>
</html>
